name: phroneo
description: "A cooperative party game where players work together to discover the hidden order."
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^16.0.0

  flutter_svg: ^2.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^6.2.1
  get_it: ^9.2.1
  cloud_firestore: ^6.7.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  slang_build_runner: ^4.18.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
          weight: 700

    - family: CormorantInfant
      fonts:
        - asset: assets/fonts/CormorantInfant.ttf
        - asset: assets/fonts/CormorantInfant-Italic.ttf
          weight: 700

    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus.ttf
          weight: 700

flutter_native_splash:
  color: "#2D2D2D"

  image: "assets/images/logo.png"

  android: true
  ios: true

  android_12:
    color: "#2D2D2D"
    image: "assets/images/logo_splash.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"