name: phroneo
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^16.0.0

  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
          weight: 700

    - family: CormorantInfant
      fonts:
        - asset: assets/fonts/CormorantInfant.ttf
        - asset: assets/fonts/CormorantInfant-Italic.ttf
          weight: 700

    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus.ttf
          weight: 700